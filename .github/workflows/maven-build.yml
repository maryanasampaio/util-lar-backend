name: Build Jar File

on:
  workflow_call: 

jobs:
  test:
    uses: ./.github/workflows/maven-tests.yml

  build:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project with Maven
        run: mvn -DskipTests clean package