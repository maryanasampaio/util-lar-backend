# H2 somente para testes
spring.datasource.url=jdbc:h2:mem:productdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false
app.seed.enabled=false
app.schema.patch.enabled=false

app.jwt.secret=test-secret-key-for-unit-tests-only-with-at-least-64-bytes-of-length-1234567890
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
