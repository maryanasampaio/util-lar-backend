spring.application.name=product-api
server.port=3000

# MariaDB datasource (padrão em runtime)
spring.datasource.url=${DB_URL:jdbc:mariadb://192.168.16.104:3306/util-lar?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false}
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

# Flyway para MySQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=changeit-super-secret-key-please-changeme
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Erros enxutos
server.error.include-stacktrace=never
server.error.include-message=always

# Twilio WhatsApp
twilio.account-sid=
twilio.auth-token=
twilio.whatsapp-number=
twilio.whatsapp.messaging-service-sid=
twilio.whatsapp.new-product-content-sid=
twilio.whatsapp.price-update-content-sid=

# Frontend URL (links em notificacoes)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# CORS (usar apenas origem, sem path)
spring.security.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://util-lar.nextagecode.com}
